context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-skia
  version: ${{ version }}

source:
  path: ..
  use_gitignore: false
  filter:
    include:
      - src/**
      - deps/skia/include/**
      - deps/skia/modules/**
      - deps/skia/out/Static/libskia.a
      - deps/skia/out/Static/skia.lib
      - deps/skia/LICENSE
      - LICENSE
      - CMakeLists.txt
      - q.lib
      - fonts/**
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - if: not win
      then:
      - make
  host:
    - freetype
  run:
    - if: linux
      then:
      - fontconfig
      else:
      - libfreetype

tests:
  - script:
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/skia.li64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/skia.ma64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\skia.wi64.dll exit 1
    - if: unix
      then:
        - test -f ${PREFIX}/fonts/ivyfonts/Noto/NotoMono-Regular.ttf
    - if: win
      then:
        - if not exist %PREFIX%\\fonts\\ivyfonts\\Noto\\NotoMono-Regular.ttf exit 1

about:
  homepage: https://github.com/KxSystems/qskia
  repository: https://github.com/KxSystems/qskia
  documentation: https://github.com/KxSystems/qskia/blob/main/docs/reference.md
  license: Apache-2.0
  license_file:
    - LICENSE
    - fonts/ivyfonts/LICENSE_OFL.txt
    - deps/skia/LICENSE
  summary: A graphics interface module via the Skia library for KDB-X.
  description: >-
    KDB-X module that provides a graphics interface via the Skia 2D graphics
    library. It lets q draw shapes, lines, pixel blocks and text onto an
    image, and render the result to PNG or raw RGB bytes.
